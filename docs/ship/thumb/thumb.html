<!doctype html><html><head><meta charset="utf-8"><title>thumb</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&family=Instrument+Serif:ital@1&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
:root{--paper:#F7F4EE;--paper2:#EFE9DC;--ink:#16130F;--panel:#1E1A15;--line:#3A3229;--grey:#6B655B;--red:#C63C22;--lift:#F2643F;--ok:#2F9E5B}
*{box-sizing:border-box;margin:0}
html,body{width:1000px;height:750px;overflow:hidden}
body{background:var(--paper);font-family:Archivo,sans-serif;color:var(--ink);position:relative}
.lbl{position:absolute;left:56px;top:46px;font-size:13px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--red);display:flex;gap:12px;align-items:center}
.lbl::before{content:"";width:28px;height:2px;background:var(--red)}
.aa{position:absolute;right:56px;top:40px;height:30px;width:auto}
h1{position:absolute;left:50px;top:84px;font-size:150px;font-weight:900;letter-spacing:-.055em;line-height:.86}
h1 em{font-family:"Instrument Serif",serif;font-style:italic;font-weight:400;color:var(--red);letter-spacing:-.02em;font-size:172px;margin-left:22px}
.sub{position:absolute;left:58px;top:376px;font:500 17px "IBM Plex Mono",monospace;color:var(--grey);letter-spacing:.01em}
.band{position:absolute;left:0;right:0;top:440px;bottom:0;background:var(--ink);overflow:hidden}
.band::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(242,100,63,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(242,100,63,.05) 1px,transparent 1px);background-size:32px 32px}
.pipe{position:absolute;left:56px;right:56px;top:118px;display:flex;align-items:center}
.node{flex:none;width:150px;height:118px;background:var(--panel);border:1.5px solid var(--line);border-radius:16px;padding:16px;color:#F7F4EE}
.node i{font-size:24px;color:#E4DCCB}
.node b{display:block;font-size:19px;font-weight:700;margin-top:14px;letter-spacing:-.02em}
.node span{font:12px "IBM Plex Mono",monospace;color:#ABA294}
.node.hot{border-color:var(--lift);box-shadow:0 0 0 5px rgba(242,100,63,.14),0 0 40px rgba(242,100,63,.25)}
.node.hot i{color:var(--lift)}
.wire{flex:1;height:2px;background:var(--line);position:relative}
.wire::after{content:"";position:absolute;left:50%;top:-5px;width:12px;height:12px;border-radius:50%;background:var(--lift);box-shadow:0 0 14px var(--lift)}
.card{position:absolute;right:56px;top:372px;width:372px;background:#fff;border-radius:18px;padding:20px 22px;transform:rotate(2.5deg);box-shadow:0 30px 60px -20px rgba(22,19,15,.6),0 2px 8px rgba(22,19,15,.15);z-index:5}
.card .k{font:600 12px "IBM Plex Mono",monospace;letter-spacing:.08em;color:var(--grey);text-transform:uppercase;display:flex;justify-content:space-between}
.card .t{font-size:27px;font-weight:800;letter-spacing:-.03em;margin-top:8px;display:flex;gap:12px;align-items:center}
.card .t i{color:var(--ok);font-size:26px}
.card .r{margin-top:12px;padding-top:12px;border-top:1px solid #E4DCCB;font-size:15px;font-weight:600;color:#3A342C;display:flex;gap:10px;align-items:center}
.card .r i{color:#FF7A59}
.card .r em{margin-left:auto;font-style:normal;color:var(--ok);font-size:14px}
</style></head><body>
